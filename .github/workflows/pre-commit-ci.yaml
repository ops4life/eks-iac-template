name: Pre-commit CI
on:
  pull_request_target:

jobs:
  pre-commit:
    # pull_request_target runs with a write token: never check out fork code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.WORKFLOW_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Read Terraform version
        id: tfv
        run: echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tfv.outputs.version }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Install Terraform-docs
        uses: jaxxstorm/action-install-gh-release@v2.1.0
        with:
          repo: terraform-docs/terraform-docs
          tag: v0.24.0
          platform: linux
          arch: amd64

      - name: Install Checkov
        run: pipx install checkov

      - name: Install GitLeaks
        run: |
          mkdir -p $RUNNER_TEMP/gitleaks
          latest_version=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep 'tag_name' | cut -d\" -f4)
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/$latest_version/gitleaks_${latest_version#v}_linux_x64.tar.gz -o $RUNNER_TEMP/gitleaks/gitleaks.tar.gz
          tar -xvzf $RUNNER_TEMP/gitleaks/gitleaks.tar.gz -C $RUNNER_TEMP/gitleaks
          sudo mv $RUNNER_TEMP/gitleaks/gitleaks /usr/local/bin/

      - name: Install pre-commit
        run: pip install pre-commit -r requirements.txt

      - name: Run pre-commit
        run: |
          pre-commit install
          pre-commit run --all-files

      - uses: stefanzweifel/git-auto-commit-action@v7
        if: always()
        with:
          commit_message: "fix: Automated Changes by Pre-commit"
